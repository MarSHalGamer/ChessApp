<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark-bg: #0f1419;
            --light-text: #c9d1d9;
            --accent: #58a6ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--light-text);
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(88, 166, 255, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(88, 166, 255, 0.03) 0%, transparent 50%);
        }

        .container {
            text-align: center;
            z-index: 1;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-icon {
            font-size: 6rem;
            color: var(--light-text);
            margin-bottom: 10px;
            text-shadow: 0 0 40px rgba(201, 209, 217, 0.2);
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 60px;
            letter-spacing: 3px;
            color: var(--light-text);
            font-weight: 800;
            text-transform: uppercase;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .btn {
            padding: 16px 60px;
            font-size: 1.3rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            width: 260px;
            border: 2px solid var(--light-text);
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 1px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            text-decoration: none;
            display: inline-block;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(201, 209, 217, 0.1);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-play {
            background-color: var(--light-text);
            color: var(--dark-bg);
            box-shadow: 0 4px 20px rgba(201, 209, 217, 0.15);
        }

        .btn-play:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(201, 209, 217, 0.25);
        }

        .btn-play:active {
            transform: translateY(-1px);
        }

        .btn-settings {
            background-color: transparent;
            color: var(--light-text);
            border: 2px solid rgba(201, 209, 217, 0.3);
        }

        .btn-settings:hover {
            border-color: var(--light-text);
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(201, 209, 217, 0.1);
        }

        .btn-settings:active {
            transform: translateY(-1px);
        }

        .btn:focus {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        .btn span {
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-icon">♞</div>
        <h1>Chess</h1>
        
        <div class="buttons-container">
            <a href="play.html" class="btn btn-play"><span>Play</span></a>
            <button class="btn btn-settings"><span>Settings</span></button>
        </div>
    </div>

</body>
</html>
